name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm workspaces: one install at the root for vscode-extension/ and browser-extension/.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Downloads VS Code and Chrome for Testing, then runs the VS Code extension's integration tests.
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:e2e
      # Chrome for Testing (downloaded) with the unpacked browser extension, headless.
      - name: Browser extension end-to-end tests
        run: npm run test:e2e:browser

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-extension/*.vsix
      - name: Build the browser extension (Chrome and Firefox)
        run: npm run build:prod -w browser-extension
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: |
            browser-extension/chrome-extension-build
            browser-extension/firefox-extension-build
